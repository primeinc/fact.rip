seeds: [0, 1, 2, 3, 4]
reliabilities: [0.5, 0.7, 0.9, 1.0]
eval_modes: ["honest_revaluation", "fake_revaluation"]

environment:
  grid_size: 8
  raw_local_cost: -0.2
  goal_reward: 1.0
  delayed_context_reward: 1.0
  max_steps: 50
  step_penalty: -0.01
  # Homeostatic physics
  max_energy: 1.0
  step_drain: 0.02
  hazard_drain: 0.25
  charge_amount: 1.0

training:
  total_timesteps: 200000
  device: "cpu"

appraisal:
  positive_bonus_target: 0.4

evaluation:
  num_episodes: 500
